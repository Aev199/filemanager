[package]
name = "filemanager-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Filesystem navigation, metadata-only activity history and safe operations"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8"
trash = "5"
walkdir = "2"
chrono = "0.4"
tempfile = "3"
filetime = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Foundation"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"
