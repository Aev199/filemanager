[package]
name = "filemanager-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Filesystem navigation, metadata-only activity history and safe operations"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8"
trash = "5"
walkdir = "2"
chrono = "0.4"
tempfile = "3"
filetime = "0.2"

[dev-dependencies]
tempfile = "3"
