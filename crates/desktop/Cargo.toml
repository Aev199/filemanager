[package]
name = "filemanager-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Windows GPUI file manager"

[[bin]]
name = "filemanager-desktop"
path = "src/main.rs"

[dependencies]
filemanager-core = { path = "../core" }
gpui = { package = "gpui-ce", version = "=0.2.2" }
gpui_platform = { package = "gpui_ce_platform", version = "=0.1.0" }
open = "5"
