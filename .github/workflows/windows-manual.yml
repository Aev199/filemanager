name: Manual Windows validation and EXE

# No push/PR trigger: avoids spending GitHub Actions minutes without request.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test core logic
        run: cargo test -p filemanager-core
      - name: Check CLI
        run: cargo check -p filemanager-cli
      - name: Check native GPUI UI
        run: cargo check -p filemanager-desktop
      - name: Build standalone app
        run: cargo build --release -p filemanager-desktop
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: filemanager-windows
          path: target/release/filemanager-desktop.exe
          retention-days: 3
          if-no-files-found: error
